---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: vikunja-${MOLECULE_DISTRO:-ubuntu2604}-mariadb
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        vikunja_debug_service_enabled: false
        # The user that verify.yml creates through the role's own
        # `user create` task file and then logs in as over the API.
        # Registration is disabled, so that is the only way in.
        vikunja_molecule_probe_username: molecule-probe
        vikunja_molecule_probe_email: molecule-probe@example.com
        vikunja_molecule_probe_password: molecule-probe-password
        # The project and task that verify.yml round-trips through the API and
        # then goes looking for in the database this scenario configured.
        vikunja_molecule_project_title: molecule-probe-project
        vikunja_molecule_task_title: molecule-probe-task
        vikunja_molecule_task_description: molecule-round-trip-marker
        # A value that can reach Vikunja only through
        # `vikunja_environment_variables_additional_variables`, and which
        # differs per scenario so a container left over from another one
        # cannot pass for this scenario's.
        vikunja_molecule_motd: molecule-motd-mariadb
        # Where a SQLite database would land, if this scenario used one.
        # It must not exist: MariaDB is meant to be the only store.
        vikunja_molecule_sqlite_path: /vikunja/data/database/vikunja.db

        # Variables for Vikunja
        vikunja_uid: 1000
        vikunja_gid: 1000
        vikunja_scheme: http
        vikunja_hostname: localhost
        vikunja_container_labels_traefik_enabled: false
        vikunja_container_http_host_bind_port: 3456
        vikunja_environment_variables_service_secret: secret
        # Exercises the role's escape hatch for settings without a dedicated
        # variable; verify.yml asserts the MOTD reached the running process.
        vikunja_environment_variables_additional_variables: |
          VIKUNJA_SERVICE_MOTD={{ vikunja_molecule_motd }}

        # Variables required for Vikunja to connect to the MariaDB database (via Unix socket)
        vikunja_database_type: mysql
        vikunja_database_mysql_username: my_database_username
        vikunja_database_mysql_password: my_database_password
        vikunja_database_name: vikunja
        vikunja_database_mysql_socket_enabled: true
        vikunja_database_mysql_socket_path_host: "{{ mariadb_run_path }}"
        vikunja_systemd_required_services_list_auto: |
          {{
            (['mariadb.service'])
          }}

        # Variables for MariaDB
        mariadb_uid: 1000
        mariadb_gid: 1000
        mariadb_root_password: mariadb_password
        mariadb_container_unix_socket_enabled: true
        mariadb_managed_databases: |
          {{
            [{
              'name': vikunja_database_name,
              'username': vikunja_database_mysql_username,
              'password': vikunja_database_mysql_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-mariadb
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
