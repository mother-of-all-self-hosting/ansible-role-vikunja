---
- name: Verify Vikunja
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the checks shared by all Vikunja scenarios
      ansible.builtin.include_tasks:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    # Verify Vikunja stores data on the database actually by asking MariaDB for the task that was
    # created over the API.
    #
    # The query goes in as the role's own database user, over the Unix socket
    # the role mounts, so the credentials the role configured are under test
    # here too.
    - name: Read the tasks Vikunja stored, out of the MariaDB database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ mariadb_identifier | default('mariadb') }}"
          - mariadb
          - "--user={{ vikunja_database_mysql_username }}"
          - "--password={{ vikunja_database_mysql_password }}"
          - --batch
          - --skip-column-names
          - "{{ vikunja_database_name }}"
          - "--execute=SELECT title FROM tasks ORDER BY id"
      register: vikunja_mariadb_tasks
      changed_when: false

    - name: Assert that the MariaDB database holds the task created over the API
      ansible.builtin.assert:
        that: vikunja_mariadb_tasks.stdout_lines == [vikunja_molecule_task_title]
        fail_msg: >-
          The `{{ vikunja_database_name }}` database holds {{ vikunja_mariadb_tasks.stdout_lines }},
          not the `{{ vikunja_molecule_task_title }}` that was created over the API
        success_msg: "The `{{ vikunja_database_name }}` MariaDB database holds the task created over the API"

    # The user was created by the role's own `user create` invocation, which
    # goes through the CLI rather than the API. Finding it in the same
    # database proves both paths write to the backend this scenario configured.
    - name: Read the users Vikunja stored, out of the MariaDB database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ mariadb_identifier | default('mariadb') }}"
          - mariadb
          - "--user={{ vikunja_database_mysql_username }}"
          - "--password={{ vikunja_database_mysql_password }}"
          - --batch
          - --skip-column-names
          - "{{ vikunja_database_name }}"
          - "--execute=SELECT username FROM users ORDER BY id"
      register: vikunja_mariadb_users
      changed_when: false

    - name: Assert that the MariaDB database holds the user the role created
      ansible.builtin.assert:
        that: vikunja_mariadb_users.stdout_lines == [vikunja_molecule_probe_username]
        fail_msg: >-
          The `{{ vikunja_database_name }}` database holds users {{ vikunja_mariadb_users.stdout_lines }},
          not the `{{ vikunja_molecule_probe_username }}` the role created
        success_msg: "The MariaDB database holds `{{ vikunja_molecule_probe_username }}`, created through the role"

    - name: Check whether Vikunja also wrote a SQLite database
      ansible.builtin.stat:
        path: "{{ vikunja_molecule_sqlite_path }}"
      register: vikunja_sqlite_file

    # The counterpart of the checks above: Vikunja falling back to SQLite
    # while MariaDB happened to be reachable would leave both stores populated
    # and the assertions above still green.
    - name: Assert that Vikunja did not fall back to SQLite
      ansible.builtin.assert:
        that: not vikunja_sqlite_file.stat.exists
        fail_msg: "Vikunja wrote a SQLite database at `{{ vikunja_molecule_sqlite_path }}` despite being pointed at MariaDB"
        success_msg: "Vikunja wrote no SQLite database, so MariaDB is its only store"
